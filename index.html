<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تنسيق موقع جنان</title>
  <meta name="description" content="منصة التنسيق اليومي بين المهندس الاستشاري ومهندس المقاول — مشروع جنان">
  <meta name="theme-color" content="#1f6f5c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101614" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="جنان">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* JENAN | Civil Site Coordination */
:root {
  --bg: #f3f4f1; --surface: #ffffff; --surface2: #f0f2ee; --line: #e0e4de; --line2: #cfd5cd;
  --text: #1b2320; --muted: #5d6964; --faint: #8a948f;
  --primary: #1f6f5c; --primary-ink: #ffffff; --primary-soft: #e2f0eb; --primary-text: #17594a;
  --open: #9a5806; --open-bg: #fcf0db;
  --review: #1d5fa8; --review-bg: #e5eefa;
  --hold: #56606b; --hold-bg: #eaedf0;
  --closed: #2b7a4c; --closed-bg: #e2f2e8;
  --crit: #b8322a; --crit-bg: #fbe8e6;
  --warn: #9a5806; --warn-bg: #fcf0db;
  --shadow: 0 1px 2px rgba(20, 30, 25, .06), 0 2px 8px rgba(20, 30, 25, .05);
  --shadow-lg: 0 10px 40px rgba(10, 20, 15, .22);
  --r: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #171f1c; --surface2: #1e2824; --line: #263330; --line2: #33433e;
    --text: #e6ece9; --muted: #9fb0a9; --faint: #6f817a;
    --primary: #3fa58a; --primary-ink: #06130f; --primary-soft: #183229; --primary-text: #7fd0b8;
    --open: #f0b357; --open-bg: #33270f;
    --review: #7fb2f0; --review-bg: #15263b;
    --hold: #a9b3bd; --hold-bg: #242b31;
    --closed: #6fcf97; --closed-bg: #13301f;
    --crit: #ff8a7f; --crit-bg: #3a1a17;
    --warn: #f0b357; --warn-bg: #33270f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lg: 0 10px 40px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #0f1513; --surface: #171f1c; --surface2: #1e2824; --line: #263330; --line2: #33433e;
    --text: #e6ece9; --muted: #9fb0a9; --faint: #6f817a;
    --primary: #3fa58a; --primary-ink: #06130f; --primary-soft: #183229; --primary-text: #7fd0b8;
    --open: #f0b357; --open-bg: #33270f;
    --review: #7fb2f0; --review-bg: #15263b;
    --hold: #a9b3bd; --hold-bg: #242b31;
    --closed: #6fcf97; --closed-bg: #13301f;
    --crit: #ff8a7f; --crit-bg: #3a1a17;
    --warn: #f0b357; --warn-bg: #33270f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lg: 0 10px 40px rgba(0, 0, 0, .6);
    color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  overflow: hidden; overscroll-behavior: none;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--primary); outline-offset: 2px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--muted); }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(-360deg); } }
.wide-only { display: none !important; }

/* ---------- تحميل ودخول ---------- */
.boot, .login { height: 100dvh; display: grid; place-items: center; padding: 24px; text-align: center; }
.boot p { color: var(--muted); }
.logo {
  width: 64px; height: 64px; border-radius: 18px; background: var(--primary); color: var(--primary-ink);
  display: grid; place-items: center; font-size: 34px; font-weight: 700; margin: 0 auto 12px;
}
.logo.sm { width: 38px; height: 38px; border-radius: 11px; font-size: 21px; margin: 0; }
.login-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 28px 22px; box-shadow: var(--shadow); }
.login-card h1 { margin: 0; font-size: 26px; }
.login-card .sub { margin: 2px 0 20px; color: var(--muted); }
.login-card .btn { margin-top: 10px; }
.demo-note { display: flex; gap: 10px; text-align: start; font-size: 13.5px; color: var(--muted); background: var(--surface2); border-radius: 12px; padding: 10px 12px; margin-bottom: 6px; }
.err { background: var(--crit-bg); color: var(--crit); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.hint { font-size: 13px; color: var(--muted); margin: 12px 0 0; }

/* ---------- أزرار ---------- */
.btn {
  min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line2);
  background: var(--surface); font-weight: 600; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap;
}
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: transparent; }
.btn.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 36px; font-size: 13.5px; padding: 0 10px; }
.btn:disabled { opacity: .55; }
.btn:active { transform: scale(.98); }
.iconbtn { width: 42px; height: 42px; border-radius: 12px; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:active { background: var(--surface2); }

/* ---------- الهيكل (جوال) ---------- */
.shell {
  height: 100vh; height: 100dvh; display: grid;
  grid-template-rows: auto auto minmax(0, 1fr) auto;
  grid-template-areas: "top" "chips" "main" "bottom";
}
.top {
  grid-area: top; padding: calc(8px + var(--safe-t)) 12px 8px;
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: "brand sync" "search search"; gap: 8px 10px; align-items: center;
}
.brand { grid-area: brand; display: flex; align-items: center; gap: 9px; min-width: 0; }
.bt { display: grid; line-height: 1.2; min-width: 0; }
.bt b { font-size: 17px; }
.bt small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.search { grid-area: search; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; height: 44px; color: var(--muted); }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; height: 100%; font-size: 16px; color: var(--text); }
.sync {
  grid-area: sync; border: 0; border-radius: 999px; padding: 6px 11px; font-size: 12.5px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; background: var(--closed-bg); color: var(--closed);
}
.sync .ic { width: 17px; height: 17px; }
.sync.off { background: var(--crit-bg); color: var(--crit); }
.sync.busy { background: var(--open-bg); color: var(--open); }
.sync.busy .ic { animation: spin 1.4s linear infinite; }

/* مؤشرات سريعة = أزرار تصفية */
.chips { grid-area: chips; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 0 12px 10px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 4px 6px;
  display: grid; grid-template-columns: auto auto; justify-content: center; align-items: center; gap: 0 5px; text-align: center;
  box-shadow: var(--shadow);
}
.chip .ic { width: 16px; height: 16px; color: var(--muted); }
.chip b { font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.chip .ct { grid-column: 1 / -1; grid-row: 2; font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.chip.ch-overdue:not(.zero) b, .chip.ch-overdue:not(.zero) .ic, .chip.ch-critical:not(.zero) b, .chip.ch-critical:not(.zero) .ic { color: var(--crit); }
.chip.ch-mine:not(.zero) b, .chip.ch-mine:not(.zero) .ic { color: var(--primary-text); }
.chip.ch-new:not(.zero) .ic { color: var(--review); }
.chip.zero b { color: var(--faint); }
.chip.on { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }

.main { grid-area: main; min-height: 0; display: grid; }
.listpane { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.listhead { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 0 14px 8px; min-height: 30px; }
.listhead h2 { font-size: 15px; margin: 0; display: flex; align-items: center; gap: 6px; }
.listhead .muted { font-size: 13px; }
.count { background: var(--surface2); border-radius: 999px; padding: 0 8px; font-size: 13px; color: var(--muted); }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 0; background: var(--primary-soft); color: var(--primary-text); border-radius: 999px; padding: 3px 10px 3px 6px; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.pill .ic { width: 14px; height: 14px; }
.list { overflow-y: auto; overscroll-behavior: contain; padding: 2px 12px 16px; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }

/* ---------- البطاقة ---------- */
.card {
  text-align: start; width: 100%; background: var(--surface); border: 1px solid var(--line);
  border-inline-start: 4px solid transparent; border-radius: var(--r); padding: 9px 12px 9px 10px;
  display: grid; gap: 5px; box-shadow: var(--shadow); flex: none;
}
.card:active { background: var(--surface2); }
.card.p-critical { border-inline-start-color: var(--crit); }
.card.sel { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.card.done { opacity: .72; }
.c1 { display: flex; align-items: flex-start; gap: 9px; }
.villa {
  flex: none; min-width: 42px; text-align: center; background: var(--primary-soft); color: var(--primary-text);
  font-weight: 700; border-radius: 8px; padding: 1px 6px; font-size: 14.5px; font-variant-numeric: tabular-nums;
}
.title { flex: 1; font-weight: 600; font-size: 15px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.newdot { color: var(--review); flex: none; margin-top: 3px; }
.newdot .ic { width: 12px; height: 12px; }
.c2, .c3 { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: 13px; }
.c3 { color: var(--muted); font-size: 12.5px; }
.st { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px 1px 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.st .ic { width: 14px; height: 14px; stroke-width: 2.2; }
.st.big { font-size: 14px; padding: 4px 12px 4px 10px; }
.st.big .ic { width: 16px; height: 16px; }
.st-open { background: var(--open-bg); color: var(--open); }
.st-review { background: var(--review-bg); color: var(--review); }
.st-hold { background: var(--hold-bg); color: var(--hold); }
.st-closed { background: var(--closed-bg); color: var(--closed); }
.who { color: var(--muted); display: inline-flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.who .ic { width: 15px; height: 15px; }
.who.mine { color: var(--primary-text); font-weight: 700; }
.due { display: inline-flex; align-items: center; gap: 3px; }
.due .ic { width: 14px; height: 14px; }
.due.late { color: var(--crit); font-weight: 700; }
.due.soon { color: var(--open); font-weight: 600; }
.prio.crit, dd.crit { color: var(--crit); font-weight: 700; display: inline-flex; align-items: center; gap: 3px; }
.prio .ic { width: 14px; height: 14px; }
.type { color: var(--muted); }
.ref { margin-inline-start: auto; color: var(--faint); font-variant-numeric: tabular-nums; }
.pend { margin-inline-start: auto; color: var(--open); display: inline-flex; gap: 3px; align-items: center; font-weight: 600; }
.pend .ic { width: 14px; height: 14px; animation: spin 1.4s linear infinite; }

.empty { display: grid; justify-items: center; gap: 6px; color: var(--muted); padding: 48px 16px; text-align: center; }
.empty .ic { width: 36px; height: 36px; stroke-width: 1.5; color: var(--faint); }
.empty p { margin: 0 0 8px; }

/* ---------- الفلل ---------- */
.villas { display: grid; grid-template-columns: repeat(auto-fill, minmax(98px, 1fr)); gap: 9px; }
.villa-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 8px; display: grid; gap: 2px; justify-items: center; box-shadow: var(--shadow); }
.villa-tile b { font-size: 22px; font-variant-numeric: tabular-nums; }
.villa-tile > span { font-size: 12.5px; color: var(--muted); }
.villa-tile.done { opacity: .6; }
.vt-flags { display: flex; gap: 8px; min-height: 18px; }
.vt-flags i { font-style: normal; display: inline-flex; align-items: center; gap: 2px; font-size: 12.5px; font-weight: 700; }
.vt-flags .ic { width: 13px; height: 13px; }
.vt-flags .late, .vt-flags .crit { color: var(--crit); }
.vt-flags .mine { color: var(--primary-text); }

/* ---------- شريط التنقل ---------- */
.bottom {
  grid-area: bottom; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + var(--safe-b));
}
.bottom button { border: 0; background: transparent; display: grid; justify-items: center; gap: 1px; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 4px 0; min-height: 48px; }
.bottom button.on { color: var(--primary-text); }
.bottom .fab { width: 56px; height: 56px; border-radius: 18px; background: var(--primary); color: var(--primary-ink); place-items: center; justify-self: center; margin-top: -18px; box-shadow: 0 6px 18px rgba(31, 111, 92, .35); padding: 0; }
.bottom .fab .ic { width: 28px; height: 28px; stroke-width: 2.4; }

/* ---------- التفاصيل (جوال: شاشة كاملة) ---------- */
.detail {
  position: fixed; inset: 0; z-index: 30; background: var(--bg);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  visibility: hidden; opacity: 0; transform: translateX(-24px); transition: opacity .18s, transform .18s, visibility 0s .18s;
}
.has-sel .detail { visibility: visible; opacity: 1; transform: none; transition: opacity .18s, transform .18s; }
.d-empty { grid-row: 1 / -1; display: grid; place-content: center; justify-items: center; color: var(--faint); gap: 6px; }
.d-empty .ic { width: 40px; height: 40px; stroke-width: 1.4; }
.d-top { display: flex; align-items: center; gap: 6px; padding: calc(6px + var(--safe-t)) 8px 6px; border-bottom: 1px solid var(--line); background: var(--surface); }
.d-top .ref { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; padding-inline: 4px; }
.tag { background: var(--surface2); border-radius: 8px; padding: 2px 8px; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.villa-tag { background: var(--primary-soft); color: var(--primary-text); }
.grow { flex: 1; }
.d-body { overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 24px; }
.d-title { font-size: 19px; line-height: 1.5; margin: 0 0 10px; }
.d-meta { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 12px; }
.d-meta .who { font-size: 14px; white-space: normal; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0 0 12px; }
.facts div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 7px 11px; }
.facts dt { font-size: 12px; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.facts dd small { font-weight: 400; color: var(--muted); }
.facts dd .ic { width: 15px; height: 15px; }
.facts dd.warn { color: var(--warn); }
.desc { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 14px; }
.tl-h { font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
.tl { list-style: none; margin: 0; padding: 0; }
.ev { display: grid; grid-template-columns: 30px 1fr; gap: 10px; position: relative; padding-bottom: 14px; }
.ev:not(:last-child)::before { content: ""; position: absolute; inset-inline-start: 14px; top: 30px; bottom: 0; width: 2px; background: var(--line); }
.ev-ic { width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); color: var(--muted); display: grid; place-items: center; }
.ev-ic .ic { width: 16px; height: 16px; }
.k-submitted .ev-ic { background: var(--review-bg); color: var(--review); }
.k-closed .ev-ic { background: var(--closed-bg); color: var(--closed); }
.k-returned .ev-ic, .k-reopened .ev-ic { background: var(--warn-bg); color: var(--warn); }
.k-hold .ev-ic { background: var(--hold-bg); color: var(--hold); }
.k-created .ev-ic { background: var(--primary-soft); color: var(--primary-text); }
.ev.pending { opacity: .7; }
.ev-b { min-width: 0; padding-top: 4px; }
.ev-h { display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline; font-size: 14px; }
.ev-h span { color: var(--muted); }
.ev-h time { margin-inline-start: auto; font-size: 12px; color: var(--faint); display: inline-flex; gap: 3px; align-items: center; }
.ev-h time .ic { width: 13px; height: 13px; }
.ev-b p { margin: 4px 0 0; white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; padding: 7px 11px; }
.changes { margin: 4px 0 0; padding-inline-start: 18px; font-size: 13.5px; color: var(--muted); }
.changes s { color: var(--faint); }
.phase { font-size: 12px; font-weight: 700; color: var(--muted); margin: 6px 0 4px; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin-top: 6px; max-width: 360px; }
.ph { aspect-ratio: 1; border: 0; padding: 0; border-radius: 10px; overflow: hidden; background: var(--surface2); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph.noimg { opacity: .4; }
.d-actions { display: grid; gap: 8px; padding: 10px 12px calc(10px + var(--safe-b)); background: var(--surface); border-top: 1px solid var(--line); }
.d-actions.n2 { grid-template-columns: 2fr 1fr; }
.d-actions.n3 { grid-template-columns: 1.25fr 1.25fr .8fr; }
.d-actions .btn { padding: 0 8px; min-height: 50px; }

/* ---------- النوافذ ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(8, 14, 12, .45); z-index: 40; animation: fade .15s; }
.sheet {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 41; background: var(--surface);
  border-radius: 20px 20px 0 0; max-height: 92dvh; display: flex; flex-direction: column; box-shadow: var(--shadow-lg);
  animation: up .2s ease-out;
}
.sheet-form { display: flex; flex-direction: column; min-height: 0; flex: 1; }
@keyframes up { from { transform: translateY(30px); opacity: .4; } }
@keyframes fade { from { opacity: 0; } }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; }
.sheet-h h2 { font-size: 17px; margin: 0; flex: 1; }
.sheet-body { overflow-y: auto; padding: 4px 16px 14px; display: grid; gap: 12px; align-content: start; min-height: 0; }
.sheet-f { padding: 10px 16px calc(12px + var(--safe-b)); border-top: 1px solid var(--line); }
.sheet-f.two { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.lbl { display: grid; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
input:not([type=radio]):not([type=file]), textarea {
  width: 100%; min-height: 46px; border: 1px solid var(--line2); border-radius: 11px; padding: 10px 12px;
  background: var(--bg); font-size: 16px; color: var(--text); font-weight: 400;
}
textarea { resize: vertical; min-height: 80px; }
input:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }

<body>
  <div id="app"><div class="boot"><div class="logo">ج</div><p>جارٍ التحميل…</p></div></div>
  <noscript>يتطلب تشغيل المنصة تفعيل JavaScript.</noscript>
  <script type="module">
// ضع هنا بيانات مشروع Supabase (من Project Settings ← API).
// المفتاح anon آمن للنشر لأن كل الصلاحيات مطبّقة داخل قاعدة البيانات.
// لا تضع مفتاح service_role هنا أبدًا.
// إذا تُركا فارغين تعمل المنصة في "الوضع التجريبي" على هذا الجهاز فقط.
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

// طبقة البيانات: Supabase (الوضع الفعلي) أو تخزين محلي (الوضع التجريبي)
// + طابور إرسال يعمل بدون إنترنت (IndexedDB)

const LIVE = Boolean(SUPABASE_URL && SUPABASE_ANON_KEY);

// ---------- أحداث داخلية ----------
const listeners = new Set();
function on(fn) { listeners.add(fn); return () => listeners.delete(fn); }
function emit(type, data) { for (const f of listeners) { try { f(type, data); } catch (e) { console.error(e); } } }

const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

function netErr(msg) {
  const e = new Error(msg || 'لا يوجد اتصال');
  e.network = true; return e;
}
function isNetMessage(m) { return /fetch|network|load failed|timed? ?out|offline|ECONN|503|502|504/i.test(m || ''); }
function fail(error) {
  const msg = error?.message || String(error);
  if (!navigator.onLine || isNetMessage(msg)) throw netErr(msg);
  throw new Error(msg);
}

// ============================================================
//  الوضع الفعلي: Supabase
// ============================================================
function liveApi() {
  let sb = null;
  const urlCache = new Map(); // path -> {url, exp}

  const api = {
    mode: 'live',
    async init() {
      const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, storageKey: 'jenan.auth' },
      });
    },
    async session() {
      const { data } = await sb.auth.getSession();
      return data.session ? { userId: data.session.user.id, email: data.session.user.email } : null;
    },
    async signIn(email, password) {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        if (/invalid/i.test(error.message)) throw new Error('البريد أو كلمة المرور غير صحيحة');
        fail(error);
      }
      return { userId: data.user.id, email: data.user.email };
    },
    async signOut() { await sb.auth.signOut(); },
    async bootstrap(userId) {
      const me = await sb.from('profiles').select('id, full_name, role').eq('id', userId).maybeSingle();
      if (me.error) fail(me.error);
      if (!me.data || !me.data.role) throw new Error('حسابك لم يُفعَّل بعد. اطلب من مدير المنصة إضافتك للمشروع.');
      const pj = await sb.from('projects').select('id, name').order('created_at').limit(1).maybeSingle();
      if (pj.error) fail(pj.error);
      if (!pj.data) throw new Error('لست عضوًا في أي مشروع بعد.');
      const pr = await sb.from('profiles').select('id, full_name, role');
      if (pr.error) fail(pr.error);
      return { me: me.data, project: pj.data, profiles: pr.data };
    },
    async fetchItems(projectId) {
      const { data, error } = await sb.from('items').select('*')
        .eq('project_id', projectId).order('updated_at', { ascending: false }).limit(5000);
      if (error) fail(error);
      return data;
    },
    async fetchReads() {
      const { data, error } = await sb.from('item_reads').select('item_id, seen_at');
      if (error) fail(error);
      return data;
    },
    async fetchEvents(itemId) {
      const { data, error } = await sb.from('item_events').select('*')
        .eq('item_id', itemId).order('created_at');
      if (error) fail(error);
      return data;
    },
    async createItem(p) {
      const { data, error } = await sb.rpc('create_item', p);
      if (error) fail(error);
      return data;
    },
    async action(p) {
      const { data, error } = await sb.rpc('item_action', p);
      if (error) fail(error);
      return data;
    },
    async edit(id, fields) {
      const { data, error } = await sb.from('items').update(fields).eq('id', id).select().single();
      if (error) fail(error);
      return data;
    },
    async upload(path, blob) {
      net();
      const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (error && !/exists|duplicate|409/i.test(error.message + (error.statusCode || ''))) fail(error);
    },
    async urls(paths) {
      const now = Date.now(), out = {}, need = [];
      for (const p of paths) {
        const c = urlCache.get(p);
        if (c && c.exp > now) out[p] = c.url; else need.push(p);
      }
      if (need.length) {
        const { data, error } = await sb.storage.from('photos').createSignedUrls(need, 3600);
        if (error) fail(error);
        for (const r of data || []) if (r.signedUrl) {
          urlCache.set(r.path, { url: r.signedUrl, exp: now + 50 * 60 * 1000 });
          out[r.path] = r.signedUrl;
        }
      }
      return out;
    },
    async markRead(itemId, userId, seenAt) {
      await sb.from('item_reads').upsert({ user_id: userId, item_id: itemId, seen_at: seenAt });
    },
    subscribe(projectId, onItem, onEvent) {
      const ch = sb.channel('jenan-' + projectId)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'items', filter: `project_id=eq.${projectId}` },
          p => p.new && p.new.id && onItem(p.new))
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'item_events', filter: `project_id=eq.${projectId}` },
          p => p.new && onEvent(p.new))
        .subscribe(status => emit('realtime', status));
      return () => sb.removeChannel(ch);
    },
  };
  return api;
}

      [172, 'request', 'تقديم تقارير اختبارات الخرسانة لصبة السقف الأول', 'normal', 'open', 2, C, 50],

      [181, 'request', 'تقرير استلام مواد الحديد للدفعة الأخيرة', 'low', 'open', 6, C, 90],
      [172, 'observation', 'تعديل غطاء الخرسانة للحديد في الأعمدة C3–C5', 'normal', 'hold', 4, C, 120],
      [160, 'observation', 'تنظيف الموقع من مخلفات الطوب حول الفيلا', 'low', 'closed', -5, C, 200],

    const out = { seq: 0, eseq: 0, items: [], events: [], reads: {} };
    for (const [villa, type, title, priority, status, due, by, h] of items) {

      const it = { id, project_id: PROJECT.id, type, villa: String(villa), title, description: '', priority, status,

const IDB = 'jenan-outbox', STORE = 'ops';
let idbP = null;
function idb() {
  return idbP ||= new Promise((res, rej) => {
    const r = indexedDB.open(IDB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'qid' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const req = fn(t.objectStore(STORE));
    t.oncomplete = () => res(req && req.result);
    t.onerror = () => rej(t.error);
  });
}
const idbPut = op => idbDo('readwrite', s => s.put(op));
const idbDel = qid => idbDo('readwrite', s => s.delete(qid));
const idbAll = () => idbDo('readonly', s => s.getAll());

const ID_MAP_KEY = 'jenan.idmap';
let idMap = {};
try { idMap = JSON.parse(localStorage.getItem(ID_MAP_KEY)) || {}; } catch {}
function rememberId(cid, id) {
  idMap[cid] = id;
  const keys = Object.keys(idMap); if (keys.length > 300) delete idMap[keys[0]];
  try { localStorage.setItem(ID_MAP_KEY, JSON.stringify(idMap)); } catch {}
}
function serverIdFor(cid) { return idMap[cid]; }

let seq = 0;
async function enqueue(op) {
  op.qid = String(Date.now()).padStart(15, '0') + '-' + String(seq++).padStart(4, '0');
  op.client_id ||= uuid();
  op.created_at = new Date().toISOString();
  await idbPut(op);
  emit('outbox', await pendingOps());
  flush();
  return op;
}
async function pendingOps() {
  try { return (await idbAll()).sort((a, b) => (a.qid < b.qid ? -1 : 1)); } catch { return []; }
}

async function runOp(op) {
  for (let i = 0; i < (op.blobs || []).length; i++) await api.upload(op.photoPaths[i], op.blobs[i]);
  if (op.kind === 'create') {
    const it = await api.createItem({ ...op.params, p_photos: op.photoPaths || [], p_client_id: op.client_id });
    rememberId(op.client_id, it.id);
    return it;
  }
  if (op.kind === 'action') {
    const id = op.itemRef.id ?? idMap[op.itemRef.client_id];
    if (!id) throw new Error('البند المرتبط لم يُحفظ في السحابة');
    return api.action({ p_item: id, ...op.params, p_photos: op.photoPaths || [], p_client_id: op.client_id });
  }
  throw new Error('عملية غير معروفة');
}

let flushing = false, again = false;
async function flush() {
  if (flushing) { again = true; return; }
  flushing = true;
  try {
    do {
      again = false;
      for (const op of await pendingOps()) {
        try {
          const item = await runOp(op);
          await idbDel(op.qid);
          emit('sent', { op, item });
        } catch (e) {
          if (e.network) { emit('offline', e.message); again = false; break; }
          await idbDel(op.qid);
          emit('failed', { op, message: e.message });
        }
      }
    } while (again);
  } finally {
    flushing = false;
    emit('outbox', await pendingOps());
  }
}
window.addEventListener('online', () => flush());

// ---------- ضغط الصور قبل الرفع ----------
async function compressImage(file, maxSide = LIVE ? 1600 : 900, quality = LIVE ? 0.72 : 0.6) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch {
    src = await new Promise((res, rej) => {
      const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file);
    });
  }
  const w0 = src.width, h0 = src.height, s = Math.min(1, maxSide / Math.max(w0, h0));
  const c = document.createElement('canvas');
  c.width = Math.round(w0 * s); c.height = Math.round(h0 * s);
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
  src.close && src.close();
  return new Promise(res => c.toBlob(res, 'image/jpeg', quality));
}

  return S.outbox.filter(o => o.kind === 'create' && !known.has(o.client_id)).map(o => ({
    id: 'c:' + o.client_id, client_id: o.client_id, pending: true, op: o,
    project_id: S.project.id, type: o.params.p_type, villa: o.params.p_villa, title: o.params.p_title,
    description: o.params.p_description || '', priority: o.params.p_priority, due_date: o.params.p_due,
    external_ref: o.params.p_external_ref, status: o.params.p_type === 'inspection' ? 'review' : 'open',
    return_count: 0, created_by: S.me.id, created_at: o.created_at, updated_at: o.created_at, last_actor: S.me.id,
  }));
}
const allItems = () => [...S.items.values(), ...pendingItems()];
function getItem(key) {
  if (key == null) return null;
  if (typeof key === 'number') return S.items.get(key) || null;
  const cid = String(key).slice(2);
  return [...S.items.values()].find(i => i.client_id === cid) || pendingItems().find(i => i.client_id === cid) || null;
}

const PW = { critical: 0, normal: 1, low: 2 };
function rank(it) {
  const upd = -Date.parse(it.updated_at || it.created_at);
  if (!active(it)) return [9, 0, 0, -Date.parse(it.closed_at || it.updated_at)];
  const g = overdue(it) ? 0 : it.priority === 'critical' ? 1 : isMine(it) ? 2 : it.status === 'hold' ? 5 : 3;
  return [g, PW[it.priority] ?? 1, it.due_date ? Date.parse(it.due_date) : 9e15, upd];
}
function cmp(a, b) { const x = rank(a), y = rank(b); for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] - y[i]; return 0; }

function matchQ(it, q) {
  if (!q) return true;
  const n = q.replace('#', '');
  return it.villa === n || it.villa.includes(n) || String(it.id) === n || it.title.includes(q) || (it.external_ref || '').includes(q);
}
function visible() {
  const f = S.f;
  let a = allItems();
  if (f.status === 'active') a = a.filter(active);
  else if (f.status === 'inactive') a = a.filter(i => i.status === 'hold' || i.status === 'closed');
  else if (f.status === 'critical') a = a.filter(i => active(i) && i.priority === 'critical');
  else if (f.status === 'overdue') a = a.filter(overdue);
  if (f.type === 'mine') a = a.filter(isMine);
  else if (f.type === 'theirs') a = a.filter(i => active(i) && ballWith(i) && ballWith(i) !== S.me.role);
  else if (f.type) a = a.filter(i => i.type === f.type);
  if (f.prio) a = a.filter(i => i.priority === f.prio);
  if (f.villa) a = a.filter(i => i.villa === f.villa);
  if (f.chip === 'mine') a = a.filter(isMine);
  if (f.chip === 'overdue') a = a.filter(overdue);
  if (f.chip === 'critical') a = a.filter(i => active(i) && i.priority === 'critical');
  if (f.chip === 'new') a = a.filter(unread);
  a = a.filter(i => matchQ(i, f.q));
  return a.sort(cmp);
}

function whoText(it) {
  if (it.status === 'closed') return { t: 'مغلق', mine: false };
  if (it.status === 'hold') return { t: 'متوقف' + (it.hold_reason ? ': ' + it.hold_reason : ''), mine: false };
  const w = ballWith(it);
  return w === S.me.role ? { t: 'مطلوب منك', mine: true } : { t: 'عند ' + T.role[w], mine: false };
}
function shortState(it) {
  if (it.status === 'closed' || it.status === 'hold') return T.status[it.status];
  return ballWith(it) === S.me.role ? 'عندي' : 'عند ' + T.role[ballWith(it)];
}
function dueText(it) {
  if (it.status === 'closed') return { t: 'أُغلق ' + (it.closed_at ? fmtDate.format(new Date(it.closed_at)) : ''), cls: '' };
  if (!it.due_date) return { t: 'بدون موعد', cls: 'muted' };
  const n = dayDiff(it.due_date);
  if (it.status === 'hold') return { t: 'الموعد ' + fmtDate.format(dd(it.due_date)), cls: 'muted' };
  if (n < 0) return { t: 'متأخر ' + days(n), cls: 'late' };
  if (n === 0) return { t: 'اليوم', cls: 'soon' };
  if (n === 1) return { t: 'غدًا', cls: 'soon' };
  return { t: 'بعد ' + days(n), cls: '' };
}

function villasHTML() {
  const m = new Map();
  for (const it of allItems().filter(i => i.villa)) {

    v.total++;
    if (active(it)) { v.active++; if (overdue(it)) v.late++; if (it.priority === 'critical') v.crit++; if (isMine(it)) v.mine++; }
    m.set(it.villa, v);
  }
  const arr = [...m.values()].sort((a, b) => (b.active > 0) - (a.active > 0) || a.villa.localeCompare(b.villa, 'en', { numeric: true }));

}

function actionsFor(it) {
  const R = S.me.role, st = it.status;
  if (R === 'consultant') {
    if (st === 'review') return [['close', 'قبول وإغلاق', 'check', 'primary'], ['return', 'إعادة للمعالجة', 'undo', 'warn'], ['comment', 'رد', 'chat', '']];
    if (st === 'open') return [['comment', 'رد', 'chat', ''], ['hold', 'إيقاف', 'pause', ''], ['close', 'إغلاق', 'check', '']];
    if (st === 'hold') return [['resume', 'استئناف', 'play', 'primary'], ['comment', 'رد', 'chat', '']];
    return [['reopen', 'إعادة فتح', 'undo', ''], ['comment', 'رد', 'chat', '']];
  }
  if (st === 'open') return [['submit', 'تم التنفيذ — أرسل للمراجعة', 'send', 'primary'], ['comment', 'رد', 'chat', '']];
  return [['comment', 'رد', 'chat', '']];
}

async function loadEvents(it) {
  if (it.pending || S.events.has(it.id)) return;
  S.events.set(it.id, null);
  try { S.events.set(it.id, await api.fetchEvents(it.id)); }
  catch { S.events.delete(it.id); }
  if (getItem(S.sel) === it || getItem(S.sel)?.id === it.id) renderDetail();
}

      <div><dt>الأولوية</dt><dd class="${it.priority === 'critical' ? 'crit' : ''}">${it.priority === 'critical' ? ic('alert') : ''}${T.prio[it.priority]}</dd></div>
      ${it.return_count ? `<div><dt>مرات الإعادة</dt><dd class="warn">${it.return_count}</dd></div>` : ''}
      ${it.external_ref ? `<div><dt>المرجع</dt><dd>${ic('link')}${esc(it.external_ref)}</dd></div>` : ''}

async function hydratePhotos(root) {
  const imgs = [...root.querySelectorAll('img[data-path]')];
  if (!imgs.length) return;
  try {
    const urls = await api.urls([...new Set(imgs.map(i => i.dataset.path))]);
    for (const i of imgs) if (urls[i.dataset.path]) { i.src = urls[i.dataset.path]; i.closest('.ph').dataset.src = urls[i.dataset.path]; }
  } catch { imgs.forEach(i => i.closest('.ph').classList.add('noimg')); }
}

function markRead(it) {
  S.reads.set(it.id, it.updated_at);
  api.markRead(it.id, S.me.id, it.updated_at).catch(() => {});
  renderChips(); renderList();
}

  if (!s) { root.innerHTML = ''; document.body.classList.remove('sheet-open'); return; }
  document.body.classList.add('sheet-open');
  // احفظ ما كتبه المستخدم قبل إعادة الرسم (مثلًا بعد إضافة صورة)
  const form = root.querySelector('form.sheet-form');
  if (form && form.dataset.sk === s.kind) {
    const v = readForm(form);
    if (s.data) { Object.assign(s.data, v); s.data.critical = !!v.critical; }
    if ('body' in v) s.body = v.body;
  }
  let inner = '';
  if (s.kind === 'add') inner = addSheet(s);
  else if (s.kind === 'action') inner = actionSheet(s);
  else if (s.kind === 'edit') inner = editSheet(s);
  else if (s.kind === 'filter') inner = filterSheet();
  else if (s.kind === 'more') inner = moreSheet();
  else if (s.kind === 'photo') {
    root.innerHTML = `<div class="lightbox" data-act="close-sheet"><img src="${esc(s.src)}" alt="صورة"><button class="iconbtn" aria-label="إغلاق">${ic('x')}</button></div>`;
    return;
  }
  const keepScroll = root.querySelector('.sheet-body')?.scrollTop || 0;
  const focusName = document.activeElement?.name;
  root.innerHTML = `<div class="backdrop" data-act="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">${inner}</div>`;
  const b = root.querySelector('.sheet-body'); if (b) b.scrollTop = keepScroll;
  if (focusName) root.querySelector(`[name="${focusName}"]`)?.focus();
  else if (s.autofocus) setTimeout(() => root.querySelector(s.autofocus)?.focus(), 60);
}

let toastT = 0;
function toast(msg, kind = '') {
  const el = $('#toast'); if (!el) return;
  el.className = 'show ' + kind; el.textContent = msg;
  clearTimeout(toastT); toastT = setTimeout(() => (el.className = ''), 3800);
}

function openItem(key) {
  const k = /^\d+$/.test(key) ? +key : key;
  const had = S.sel != null;
  S.sel = k;
  if (!had) history.pushState({ layer: 'detail' }, '');
  renderList(); renderDetail();
}
function closeItem() { if (S.sel != null) history.back(); }

window.addEventListener('popstate', () => {
  if (S.sheet) { S.sheet = null; renderSheet(); return; }
  if (S.sel != null) { S.sel = null; renderList(); renderDetail(); }
});

function newAddData() {
  return { type: 'observation', villa: S.f.villa || '', title: '', description: '', critical: false, due: '' };
}

async function addPhotos(files) {
  const s = S.sheet; if (!s) return;
  s.photos ||= [];
  const list = [...files].slice(0, 8 - s.photos.length);
  if (!list.length) return toast('الحد الأقصى 8 صور');
  s.busy = true; renderSheet();
  for (const f of list) {
    try { const blob = await compressImage(f); if (blob) s.photos.push({ blob, url: URL.createObjectURL(blob) }); }
    catch { toast('تعذّر قراءة الصورة', 'err'); }
  }
  s.busy = false; renderSheet();
}

function readForm(form) { return Object.fromEntries(new FormData(form).entries()); }

async function submitAdd(form) {
  const s = S.sheet, v = readForm(form);
  const type = S.me.role === 'contractor' ? 'inspection' : (v.type || 'observation');
  const villa = toLatin(v.villa || '').trim(), title = (v.title || '').trim();
  if (title.length < 2) return toast('اكتب عنوانًا مختصرًا', 'err');
  const photos = s.photos || [];
  const op = await enqueue({
    kind: 'create',
    params: { p_project: S.project.id, p_type: type, p_villa: villa, p_title: title, p_description: (v.description || '').trim(),
      p_priority: v.critical ? 'critical' : 'normal', p_due: v.due || null, p_external_ref: null },
    photoPaths: photos.map(() => `${S.project.id}/${uuid()}.jpg`), blobs: photos.map(p => p.blob),
  });
  closeSheet();
  if (!S.online) toast('حُفظ على الجهاز — سيُرسل تلقائيًا عند عودة الاتصال');
  else toast('تمت الإضافة', 'ok');
  if (matchMedia('(min-width: 900px)').matches) setTimeout(() => openItem('c:' + op.client_id), 200);
}

async function submitAction(form) {
  const s = S.sheet, it = getItem(s.key), c = ACT[s.a];
  if (!it) return;
  const body = (readForm(form).body || '').trim(), photos = s.photos || [];
  if (c.need === 'text' && !body) return toast('السبب مطلوب', 'err');
  if (c.need === 'any' && !body && !photos.length) return toast(s.a === 'submit' ? 'اكتب الإجراء المنفذ أو أرفق صورة' : 'اكتب ردًا أو أرفق صورة', 'err');
  await enqueue({
    kind: 'action', itemRef: it.pending ? { client_id: it.client_id } : { id: it.id },
    params: { p_action: s.a, p_body: body },
    photoPaths: photos.map(() => `${S.project.id}/${uuid()}.jpg`), blobs: photos.map(p => p.blob),
  });
  closeSheet();
  if (!S.online) toast('حُفظ على الجهاز — سيُرسل عند عودة الاتصال');
}

async function submitEdit(form) {
  const s = S.sheet, v = readForm(form);
  const fields = { villa: toLatin(v.villa).trim(), title: v.title.trim(), description: v.description.trim(),
    priority: v.critical ? 'critical' : (getItem(s.id)?.priority === 'low' ? 'low' : 'normal'), due_date: v.due_date || null };
  s.busy = true; renderSheet();
  try {
    const it = await api.edit(s.id, fields);
    upsertItem(it); S.events.delete(it.id);
    closeSheet(); toast('تم حفظ التعديل', 'ok');
  } catch (e) {
    s.busy = false; renderSheet();
    toast(e.network ? 'التعديل يحتاج اتصالًا بالإنترنت' : e.message, 'err');
  }
}

function rowsForExport() {
  return visible().map(it => ({
    'الرقم': it.pending ? '' : it.id, 'النوع': T.type[it.type], 'الفيلا': it.villa, 'العنوان': it.title,
    'الوصف': it.description || '', 'الأولوية': T.prio[it.priority], 'الحالة': T.status[it.status],
    'عند': it.status === 'open' ? 'المقاول' : it.status === 'review' ? 'الاستشاري' : '',
    'الاستحقاق': it.due_date || '', 'متأخر': overdue(it) ? 'نعم' : '', 'مرات الإعادة': it.return_count || 0,
    'المرجع': it.external_ref || '', 'تاريخ الإنشاء': (it.created_at || '').slice(0, 10), 'تاريخ الإغلاق': (it.closed_at || '').slice(0, 10),
  }));
}
function exportCSV() {
  const rows = rowsForExport();
  if (!rows.length) return toast('لا توجد بنود للتصدير');
  const cols = Object.keys(rows[0]);
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const csv = '﻿' + [cols.map(q).join(','), ...rows.map(r => cols.map(c => q(r[c])).join(','))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `jenan-${today()}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function printReport() {
  const rows = visible();
  $('#print').innerHTML = `
    <h1>${esc(S.project.name)} — سجل التنسيق</h1>
    <p>${esc(new Intl.DateTimeFormat('ar-u-nu-latn-ca-gregory', { dateStyle: 'full' }).format(new Date()))} · ${rows.length} بند · أعدّه ${esc(S.me.full_name)}</p>
    <table><thead><tr><th>#</th><th>الفيلا</th><th>العنوان</th><th>النوع</th><th>الأولوية</th><th>الحالة</th><th>عند</th><th>الاستحقاق</th></tr></thead>
    <tbody>${rows.map(it => `<tr class="${overdue(it) ? 'late' : ''}"><td>${it.pending ? '' : it.id}</td><td>${esc(it.villa)}</td><td>${esc(it.title)}</td>
      <td>${T.typeShort[it.type]}</td><td>${T.prio[it.priority]}</td><td>${T.status[it.status]}</td>
      <td>${it.status === 'open' ? 'المقاول' : it.status === 'review' ? 'الاستشاري' : '—'}</td>
      <td>${esc(it.due_date || '—')}${overdue(it) ? ' (متأخر)' : ''}</td></tr>`).join('')}</tbody></table>`;
  closeSheet();
  setTimeout(() => window.print(), 300);
}

document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  switch (a) {
    case 'demo-login': await api.signIn(b.dataset.role); start(); break;
    case 'open': openItem(b.dataset.key); break;
    case 'back': closeItem(); break;
    case 'home':
      Object.assign(S.f, { chip: null, q: '', villa: '', type: '', status: 'active', prio: '' });
      if ($('#q')) $('#q').value = '';
      S.view = 'home';
      if (S.sel != null && !matchMedia('(min-width: 900px)').matches) closeItem();
      renderAll(); $('#list') && ($('#list').scrollTop = 0); break;
    case 'view':
      S.view = b.dataset.view;
      if (S.view === 'home' && S.sel != null && !matchMedia('(min-width: 900px)').matches) closeItem();
      renderList(); break;
    case 'pick-villa': S.f.villa = b.dataset.v; S.f.chip = null; S.view = 'home'; renderAll(); break;
    case 'chip': S.f.chip = S.f.chip === b.dataset.k ? null : b.dataset.k; if (S.view !== 'home') S.view = 'home'; renderChips(); renderList(); if (S.sheet?.kind === 'filter') renderSheet(); break;
    case 'clear': if (b.dataset.k === 'status') S.f.status = 'active'; else S.f[b.dataset.k] = ''; renderList(); break;
    case 'clear-all':
      Object.assign(S.f, { chip: null, q: '', villa: '', type: '', status: 'active', prio: '' });
      if ($('#q')) $('#q').value = '';
      if (S.sheet?.kind === 'filter') closeSheet();
      renderAll(); break;
    case 'add': openSheet({ kind: 'add', data: newAddData(), photos: [], autofocus: S.f.villa ? '[name=title]' : '[name=villa]' }); break;
    case 'qv': {
      const f = $('#add-form'); if (!f) break;
      f.querySelector('[name=villa]').value = b.dataset.v;
      renderSheet(); $('#add-form [name=title]')?.focus(); break;
    }
    case 'clear-due': { const i = document.querySelector('#add-form [name=due]'); if (i) { i.value = ''; renderSheet(); } break; }
    case 'rm-photo': S.sheet.photos.splice(+b.dataset.i, 1); renderSheet(); break;
    case 'act': openSheet({ kind: 'action', a: b.dataset.a, key: S.sel, photos: [], autofocus: 'textarea' }); break;
    case 'edit': { const it = getItem(S.sel); openSheet({ kind: 'edit', id: it.id, data: { ...it, critical: it.priority === 'critical' } }); break; }
    case 'filter': openSheet({ kind: 'filter' }); break;
    case 'fset': S.f[b.dataset.k] = b.dataset.v; S.f.chip = null; renderSheet(); renderList(); renderChips(); break;
    case 'more': openSheet({ kind: 'more' }); break;
    case 'close-sheet': if (e.target === b || b.tagName === 'BUTTON' || b.classList.contains('lightbox')) closeSheet(); break;
    case 'photo': if (b.dataset.src) openSheet({ kind: 'photo', src: b.dataset.src }); break;
    case 'flush': flush(); break;
    case 'export': exportCSV(); break;
    case 'print': printReport(); break;
    case 'install':
      if (installEvt) { installEvt.prompt(); installEvt = null; closeSheet(); }
      else toast('من قائمة المتصفح اختر: إضافة إلى الشاشة الرئيسية'); break;
    case 'switch-role':
      await api.signIn(S.me.role === 'consultant' ? 'contractor' : 'consultant');
      S.sheet = null; history.replaceState(null, ''); location.reload(); break;
    case 'reset-demo':
      if (b.dataset.armed) { api.resetDemo(); location.reload(); }
      else { b.dataset.armed = '1'; b.querySelector('span').textContent = 'اضغط مرة أخرى للتأكيد'; }
      break;
    case 'logout': if (S.outbox.length && !confirm('توجد عمليات لم تُرسل بعد. الخروج الآن قد يؤخر إرسالها. متابعة؟')) break;
      await api.signOut(); location.reload(); break;
  }
});

document.addEventListener('change', e => {

  if (t.name && S.sheet && ['add', 'edit'].includes(S.sheet.kind) && (t.type === 'radio' || t.type === 'checkbox' || t.type === 'date')) {
    const due = t.form.querySelector('[name=due]');
    renderSheet();
  }
});
document.addEventListener('toggle', e => { if (e.target.matches?.('details.more') && S.sheet?.data) S.sheet.data.open = e.target.open; }, true);

document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'login-form') {
    const v = readForm(f), btn = f.querySelector('button');
    btn.disabled = true; btn.textContent = 'جارٍ الدخول…';
    try { await api.signIn(v.email.trim(), v.password); start(); }
    catch (err) { renderLogin(err.network ? 'لا يوجد اتصال بالإنترنت' : err.message); }
  }
  if (f.id === 'add-form') submitAdd(f);
  if (f.id === 'action-form') submitAction(f);
  if (f.id === 'edit-form') submitEdit(f);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (S.sheet) closeSheet(); else if (S.sel != null) closeItem(); } });

// ============================================================
//  البيانات والمزامنة
// ============================================================
function upsertItem(it) {
  if (!it || !it.id) return;
  const prev = S.items.get(it.id);
  if (prev && Date.parse(prev.updated_at) > Date.parse(it.updated_at)) return;
  S.items.set(it.id, it);
  if (typeof S.sel === 'string' && it.client_id && S.sel === 'c:' + it.client_id) S.sel = it.id;
  saveCache();
}

on((type, data) => {
  if (!S.me) return;
  if (type === 'outbox') { S.outbox = data; renderAll(); }
  if (type === 'sent') {
    upsertItem(data.item);
    if (data.op.kind === 'action') { S.events.delete(data.item.id); }
    renderAll();
  }
  if (type === 'failed') { toast('لم يُحفظ: ' + data.message, 'err'); refreshItems(); }
  if (type === 'realtime') {
    const was = S.rt; S.rt = data;
    if (data === 'SUBSCRIBED' && was && was !== 'SUBSCRIBED') refreshItems();
  }
});

function onRemoteItem(it) {
  upsertItem(it);
  const sel = getItem(S.sel);
  if (sel && sel.id === it.id) { if (it.last_actor !== S.me.id) markRead(it); }
  renderAll();
}
function onRemoteEvent(ev) {
  const list = S.events.get(ev.item_id);
  if (Array.isArray(list) && !list.some(x => x.id === ev.id)) list.push(ev);
  const sel = getItem(S.sel);
  if (sel && sel.id === ev.item_id) renderDetail();
}

const CACHE = () => 'jenan.cache.' + (LIVE ? 'live.' : 'demo.') + S.me?.id;
let cacheT = 0;
function saveCache() {
  clearTimeout(cacheT);
  cacheT = setTimeout(() => {
    try { localStorage.setItem(CACHE(), JSON.stringify({ me: S.me, project: S.project, profiles: Object.values(S.profiles),
      items: [...S.items.values()], reads: [...S.reads.entries()] })); } catch {}
  }, 400);
}
function loadCache(userId) {
  try { return JSON.parse(localStorage.getItem('jenan.cache.' + (LIVE ? 'live.' : 'demo.') + userId)); } catch { return null; }
}

let lastRefresh = 0;
async function refreshItems() {
  lastRefresh = Date.now();
  try {
    const [items, reads] = await Promise.all([api.fetchItems(S.project.id), api.fetchReads()]);
    S.items = new Map(items.map(i => [i.id, i]));
    S.reads = new Map(reads.map(r => [r.item_id, r.seen_at]));
    S.loaded = true;
    const sel = getItem(S.sel); if (sel && !sel.pending) S.events.delete(sel.id);
    S.events = new Map([...S.events].filter(([id]) => sel && id === sel.id));
    saveCache(); renderAll();
  } catch (e) {
    S.loaded = true; renderAll();
    if (!e.network) toast(e.message, 'err');
  }
}

window.addEventListener('online', () => { S.online = true; renderSync(); if (S.me) { flush(); refreshItems(); } });
window.addEventListener('offline', () => { S.online = false; renderSync(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.me && Date.now() - lastRefresh > 15000) { flush(); refreshItems(); }
});

let unsub = null;
async function start() {
  renderBoot();
  try { await api.init(); }
  catch { return renderBoot('تعذّر تحميل المنصة — تحقق من الاتصال ثم أعد فتح الصفحة'); }
  const sess = await api.session().catch(() => null);
  if (!sess) return renderLogin();
  let boot;
  try { boot = await api.bootstrap(sess.userId); }
  catch (e) {
    const c = e.network ? loadCache(sess.userId) : null;
    if (c) { boot = c; }
    else if (e.network) return renderBoot('لا يوجد اتصال بالإنترنت. افتح المنصة مرة واحدة على الأقل وأنت متصل.');
    else { await api.signOut().catch(() => {}); return renderLogin(e.message); }
  }
  S.me = boot.me; S.project = boot.project;
  S.profiles = Object.fromEntries((boot.profiles || []).map(p => [p.id, p]));
  const cached = loadCache(S.me.id);
  if (cached?.items) {
    S.items = new Map(cached.items.map(i => [i.id, i]));
    S.reads = new Map(cached.reads || []);
    S.loaded = true;
  }
  S.outbox = await pendingOps();
  document.body.className = 'role-' + S.me.role;
  renderShell();
  await refreshItems();
  unsub && unsub();
  unsub = api.subscribe(S.project.id, onRemoteItem, onRemoteEvent);
  flush();
}

if ('serviceWorker' in navigator && location.protocol === 'https:' || location.hostname === 'localhost') {
  navigator.serviceWorker?.register('./sw.js').catch(() => {});
}
start();

</script>
